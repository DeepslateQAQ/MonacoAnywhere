<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="editor.pageTitle"></title>
    <link rel="stylesheet" href="editor.css" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      .ma-editor-page {
        display: flex;
        flex-direction: column;
        block-size: 100vh;
        margin: 0;
        overflow: hidden;
        background: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        .ma-editor-page {
          background: #1e1e1e;
        }
      }
      .ma-editor-page > .ma-editor-header {
        position: relative;
        flex: 0 0 auto;
        border-bottom: 1px solid var(--m3e-sys-color-outline-variant);
        background: var(--m3e-sys-color-surface-container-low);
      }
      .ma-editor-page .ma-editor-header .ma-toolbar {
        gap: 8px;
        align-items: baseline;
        min-height: 0;
        padding: 7px 12px 3px;
        background: transparent;
      }
      .ma-editor-page .ma-editor-header .ma-toolbar h1 {
        margin: 0;
        color: var(--m3e-sys-color-on-surface);
        font-size: 14px;
        font-weight: 650;
        line-height: 20px;
        letter-spacing: 0;
        white-space: nowrap;
      }
      .ma-editor-page .ma-editor-header .ma-toolbar h1 .ma-version {
        margin-inline-start: 7px;
        color: var(--m3e-sys-color-on-surface-variant);
        font-size: 11px;
        font-weight: 400;
      }
      .ma-editor-page > .ma-editor-header #ma-editor-status {
        min-inline-size: 0;
        max-inline-size: 62%;
        overflow: hidden;
        color: var(--m3e-sys-color-on-surface-variant);
        font-size: 11.5px;
        line-height: 16px;
        text-align: end;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ma-editor-page > .ma-editor-header .ma-status {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
      }
      .ma-editor-page > .ma-editor-header #ma-editor-status {
        min-inline-size: 0;
        max-inline-size: 62%;
        overflow: hidden;
        color: var(--m3e-sys-color-on-surface-variant);
        font-size: 11.5px;
        line-height: 16px;
        text-align: end;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ma-editor-page [hidden] {
        display: none !important;
      }
      html:has(> body.ma-modal-mode),
      body.ma-modal-mode {
        background: transparent !important;
        overflow: hidden;
      }
      body.ma-modal-mode > :not(.ma-dialog-scope) {
        visibility: hidden !important;
      }
      .ma-editor-page.ma-site-mode > .ma-editor-header .ma-toolbar {
        display: none;
      }
      .ma-editor-page.ma-site-mode .ma-editor-site-toolbar {
        flex-wrap: nowrap;
        gap: 8px;
        min-block-size: 34px;
        padding: 3px 8px;
      }
      .ma-editor-site-status {
        flex: 1 1 auto;
        min-inline-size: 0;
        margin: 0;
        overflow: hidden;
        color: var(--m3e-sys-color-on-surface-variant);
        font-size: 11.5px;
        line-height: 16px;
        text-align: end;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ma-editor-site-status[data-kind="error"] {
        color: var(--m3e-sys-color-error);
      }
      .ma-ui .ma-editor-site-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        align-items: center;
        padding: 0 12px 5px;
      }
      .ma-ui .ma-editor-site-toolbar .ma-status,
      .ma-ui .ma-editor-site-toolbar .ma-meta {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        color: var(--m3e-sys-color-on-surface-variant);
        font-size: 11.5px;
        line-height: 16px;
      }
      .ma-ui .ma-editor-standard-field {
        --m3e-comp-text-field-min-height: 28px;
        --m3e-comp-text-field-outlined-min-height: 28px;
        --m3e-comp-text-field-min-width: 96px;
        --m3e-comp-text-field-outlined-min-width: 96px;
        --m3e-comp-text-field-padding: 4px;
        --m3e-comp-text-field-min-text-line-height: 20px;
        --m3e-comp-outlined-text-field-input-size: 12px;
        --m3e-comp-outlined-text-field-input-line-height: 20px;
        flex: 0 0 auto;
      }
      .ma-ui .ma-editor-standard-field select {
        appearance: auto;
      }
      .ma-editor-host {
        flex: 1 1 auto;
        min-block-size: 0;
      }
    </style>
  </head>
  <body class="ma-editor-page">
    <div class="ma-ui ma-editor-header">
      <header class="ma-toolbar">
        <h1 id="ma-editor-title">MonacoAnywhere<span id="ma-editor-version" class="ma-version"></span></h1>
        <span class="ma-toolbar__spacer" aria-hidden="true"></span>
        <p id="ma-editor-status" class="ma-status" role="status"></p>
      </header>
      <div id="ma-editor-site-toolbar" class="ma-editor-site-toolbar" hidden>
        <label
          class="ma-editor-standard-field m3e-text-field m3e-text-field--outlined"
          for="ma-editor-standard"
        >
          <span class="m3e-text-field__container">
            <select id="ma-editor-standard" class="m3e-text-field__input"></select>
            <span class="m3e-text-field__outline"></span>
          </span>
        </label>
        <p
          id="ma-editor-site-status"
          class="ma-status ma-editor-site-status"
          role="status"
        ></p>
      </div>
    </div>
    <div id="ma-editor" class="ma-editor-host" data-monaco-anywhere-editor></div>
    <script type="module" src="editor-boot.js"></script>
  </body>
</html>
