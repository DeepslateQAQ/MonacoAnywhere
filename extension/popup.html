<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="popup.pageTitle"></title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      .ma-ui.ma-popup-page {
        inline-size: 360px;
        min-block-size: 0;
        padding: 16px;
      }
      .ma-ui [hidden] {
        display: none !important;
      }
      .ma-ui .ma-popup {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .ma-ui .ma-popup .ma-card {
        gap: 10px;
      }
      .ma-ui .ma-popup dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 8px 12px;
        margin: 0;
      }
      .ma-ui .ma-popup dt {
        color: var(--m3e-sys-color-on-surface-variant);
      }
      .ma-ui .ma-popup dd {
        margin: 0;
        text-align: end;
        overflow-wrap: anywhere;
      }
      .ma-ui .ma-popup .ma-actions {
        display: grid;
      }
      .ma-ui .ma-popup .ma-actions .m3e-button {
        inline-size: 100%;
      }
      .ma-ui .ma-loading-slot {
        display: flex;
        justify-content: center;
        padding: 8px;
      }
      .ma-ui .ma-loading-slot:empty {
        display: none;
      }
    </style>
  </head>
  <body class="ma-ui ma-popup-page">
    <main class="ma-popup">
      <header>
        <h1 data-i18n="common.appName"></h1>
        <p class="ma-eyebrow" id="ma-popup-build"></p>
      </header>

      <section class="ma-card" data-i18n-aria-label="popup.statusAria">
        <dl>
          <dt data-i18n="popup.backend.label"></dt>
          <dd id="ma-popup-backend"></dd>
          <dt data-i18n="popup.services.label"></dt>
          <dd id="ma-popup-services"></dd>
          <dt data-i18n="popup.registrations.label"></dt>
          <dd id="ma-popup-registrations"></dd>
        </dl>
        <p id="ma-popup-oobe" class="ma-note"></p>
        <p class="ma-id">
          <span data-i18n="common.extensionId"></span>:
          <code id="ma-popup-id"></code>
        </p>
      </section>

      <div id="ma-popup-loading" class="ma-loading-slot"></div>

      <div class="ma-actions">
        <button
          id="ma-open-setup"
          class="m3e-button m3e-button--size-m"
          type="button"
          data-i18n="popup.openSetup"
        ></button>
        <button
          id="ma-open-options"
          class="m3e-button m3e-button--outlined m3e-button--size-m"
          type="button"
          data-i18n="popup.openOptions"
        ></button>
        <button
          id="ma-open-fixture"
          class="m3e-button m3e-button--text m3e-button--size-m"
          type="button"
          data-i18n="popup.openFixture"
        ></button>
      </div>

      <div id="ma-popup-error" class="ma-status" role="status" hidden></div>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
